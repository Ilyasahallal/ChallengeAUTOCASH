# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/autocash
spring.data.mongodb.database=autocash

# Server Configuration
server.port=8080

# Application Name
spring.application.name=ChallengeAUTOCASH Backend

# Logging
logging.level.org.springframework.data.mongodb=DEBUG
logging.level.com.autocash=DEBUG

# CORS Configuration (permettre les requêtes depuis React Native)
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# Jackson Configuration (format de date)
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
